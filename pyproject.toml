[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clair_obscur"
version = "0.1.0"
description = "Async lifecycle manager for a local ComfyUI or AUTOMATIC1111 image server that shares the GPU with LLMs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sakir Cimen" }]
keywords = ["comfyui", "automatic1111", "stable-diffusion", "gpu", "process-manager", "local-ai", "kutai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = [
    "dallama @ git+https://github.com/msakirc/dallama.git",
    "nerd_herd @ git+https://github.com/msakirc/nerd-herd.git",
    "httpx>=0.27",
    "psutil>=5.9",
    "yazbunu @ git+https://github.com/msakirc/yazbunu.git",
]

[project.urls]
Homepage = "https://github.com/msakirc/clair-obscur"
Repository = "https://github.com/msakirc/clair-obscur"
Monorepo = "https://github.com/msakirc/kutai/tree/main/packages/clair_obscur"

[tool.setuptools.packages.find]
where = ["src"]
